name: Release

# 由 v* tag 触发。发布前重跑全部门禁，任何一项失败都不会走到 publish。
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # 验证在 macOS 上跑：Keychain / codesign / Finder 相关测试在 Linux 上会被 skip，
  # 只有 macOS 才能给出完整覆盖。
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22.x 最新版：同时满足 trusted publishing (>=22.14.0)
          # 与原生 TypeScript 类型剥离 (>=22.18)
          node-version: '22'

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run check

      - name: 全量测试
        run: npm test

      - name: 专项测试
        run: |
          npm run test:transport
          npm run test:security
          npm run test:extension

      - name: 构建 plugin staging
        run: npm run build:plugin

      - name: 校验 plugin 与 marketplace manifest
        run: |
          npx --yes @anthropic-ai/claude-code@latest plugin validate ./build/plugin
          npx --yes @anthropic-ai/claude-code@latest plugin validate .

      - name: tarball 审计
        run: npm run audit:package

      - name: 校验 tag 与包版本一致
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./build/plugin/package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "tag ($TAG) 与包版本 ($PKG) 不一致"; exit 1
          fi
          echo "版本一致：$PKG"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    # Environment 便于加审批门禁，也便于 npm Trusted Publisher 精确绑定
    environment: npm-publish
    permissions:
      # OIDC trusted publishing 的唯一必需权限；仓库内不存放任何长期 npm token
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22.x 最新版：满足 trusted publishing (>=22.14.0) 与原生 .ts 支持 (>=22.18)
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: 升级 npm 到支持 trusted publishing 的版本（>= 11.5.1）
        run: npm install -g npm@latest

      - name: 记录 npm 版本
        run: npm --version

      - name: 安装依赖
        run: npm ci

      - name: 用与 CI 相同的脚本重新构建发布包
        run: npm run build:plugin

      - name: 发布前再次审计 tarball
        run: npm run audit:package

      - name: 幂等保护——该版本若已存在则跳过发布
        id: exists
        run: |
          NAME=$(node -p "require('./build/plugin/package.json').name")
          VER=$(node -p "require('./build/plugin/package.json').version")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "已存在 $NAME@$VER，跳过发布"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 发布到 npm（OIDC trusted publishing，无 token）
        if: steps.exists.outputs.skip == 'false'
        # 不设置 NODE_AUTH_TOKEN：认证完全依赖 id-token。
        # provenance 由 npm 在受支持的 CI 上自动生成，此处不强制传 --provenance。
        run: npm publish --access public
        working-directory: build/plugin
